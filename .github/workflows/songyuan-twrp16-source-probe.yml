name: Songyuan TWRP16 public source probe

on:
  push:
    branches:
      - twrp16-songyuan-source-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout public fork only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reclaim public runner disk
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Probe official TWRP16 Clang project only
        shell: bash
        run: bash scripts/songyuan-twrp16-clang-probe.sh

      - name: Upload public source diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: twrp16-source-clang-${{ github.run_id }}
          path: ${{ runner.temp }}/songyuan-clang-probe/
          if-no-files-found: warn
          retention-days: 3
