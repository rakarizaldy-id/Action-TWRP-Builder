name: songyuan
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: songyuan-build
  cancel-in-progress: true
jobs:
  build:
    if: github.actor == 'rakarizaldy-id' && github.ref == 'refs/heads/songyuan'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      TWRP_DIR: ${{ github.workspace }}/twrp
      OEM_DIR: ${{ github.workspace }}/project/prebuilt
      LOGS: ${{ github.workspace }}/songyuan-source
      SONGYUAN_DT_ROOT: ${{ github.workspace }}/project
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rakarizaldy-id/android_device_xiaomi_songyuan-recovery
          ref: ee0530fb30648a9a1c7b6f569d92ceb72b4d43b1
          path: project
          persist-credentials: false
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C project rev-parse HEAD)" = "ee0530fb30648a9a1c7b6f569d92ceb72b4d43b1"
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$(df -Pk "$GITHUB_WORKSPACE" | awk 'END{print $2}')" -ge 131072000
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /usr/local/.ghcup /opt/ghc /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          test "$(df -Pk "$GITHUB_WORKSPACE" | awk 'END{print $4}')" -ge 99614720
          python3 tools/songyuan/verify_oem.py "$OEM_DIR"
          python3 tools/songyuan/check_id305_module_graph.py --board project/BoardConfig.mk --curated "$OEM_DIR"
          python3 tools/songyuan/validate_clean.py project
          python3 tools/songyuan/audit_recovery_copy_map.py project
          bash -n tools/songyuan/compact_twrp16_ci.sh
          bash -n tools/songyuan/probe_clang_sparse.sh
          bash -n tools/songyuan/apply_recovery_patches.sh
          bash -n tools/songyuan/prepare.sh
      - name: Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends repo git curl ca-certificates python3 python3-pip gh lz4 cpio bc bison flex gperf zip unzip rsync libxml2-utils libssl-dev liblz4-tool zstd build-essential binutils
      - name: Source
        shell: bash
        run: |
          set -euo pipefail
          bash tools/songyuan/compact_twrp16_ci.sh "$TWRP_DIR" "$LOGS"
          python3 tools/songyuan/verify_oem.py "$OEM_DIR"
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/tools/songyuan/patches/crypto.patch"
          git -C "$TWRP_DIR/system/vold" apply --check "$patch"
          git -C "$TWRP_DIR/system/vold" apply "$patch"
          bash tools/songyuan/apply_recovery_patches.sh "$TWRP_DIR"
          bash tools/songyuan/prepare.sh "$TWRP_DIR" "$OEM_DIR" "$SONGYUAN_DT_ROOT"
          python3 tools/songyuan/validate_clean.py "$TWRP_DIR/device/xiaomi/songyuan" --staged

          # Static ownership review: native Make destinations, Soong input,
          # recovery overlay, VINTF/fstab paths and source graph contracts.
          python3 tools/songyuan/audit_recovery_copy_map.py "$TWRP_DIR/device/xiaomi/songyuan"
          python3 tools/songyuan/verify_recovery_install_owners.py "$TWRP_DIR" "$TWRP_DIR/device/xiaomi/songyuan"
      - name: Provision proven Songyuan build swap
        shell: bash
        run: |
          set -euo pipefail
          # The successful ID305 ELF runs on 17-18 Oct 2026 allocated 6 GiB
          # extra swap after sync/staging, with at least 24 GiB disk free.
          free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'END {print $4}')"
          echo "Pre-Soong free disk: $((free_kib / 1048576)) GiB"
          test "$free_kib" -ge 25165824
          swap="$RUNNER_TEMP/songyuan-swapfile"
          test ! -e "$swap"
          sudo fallocate -l 6G "$swap"
          sudo chmod 600 "$swap"
          sudo mkswap "$swap"
          sudo swapon "$swap"
          swapon --show
          swapon --show=NAME --noheadings | grep -Fxq "$swap"
          free -h
          df -h "$GITHUB_WORKSPACE"
      - name: Compile complete pre-image recovery tree
        shell: bash
        run: |
          set -eo pipefail
          cd "$TWRP_DIR"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export SKIP_ABI_CHECKS=true
          lunch twrp_songyuan-bp2a-eng
          test "$TARGET_PRODUCT" = twrp_songyuan

          # The *actual* TWRP16 build/make recoveryimage graph has:
          #   ramdisk_files-timestamp -> recovery ramdisk CPIO -> compressed ramdisk
          #   -> mkbootimg recovery.img. Build its first target, not an invented
          # list of ELF/Soong targets. That stages the complete recovery root
          # and all source-declared dependencies but makes NO image on GitHub.
          makefile=build/make/core/Makefile
          grep -Fq 'INTERNAL_RECOVERY_RAMDISK_FILES_TIMESTAMP := $(call intermediates-dir-for,PACKAGING,recovery)/ramdisk_files-timestamp' "$makefile"
          grep -Fq '$(INTERNAL_RECOVERY_RAMDISK_FILES_TIMESTAMP): $(MKBOOTFS)' "$makefile"
          grep -Fq '$(recovery_uncompressed_ramdisk): $(INTERNAL_RECOVERY_RAMDISK_FILES_TIMESTAMP)' "$makefile"
          grep -Fq '$(recovery_ramdisk): $(recovery_uncompressed_ramdisk)' "$makefile"
          grep -Fq '$(INSTALLED_RECOVERYIMAGE_TARGET): $(recoveryimage-deps)' "$makefile"
          product=out/target/product/songyuan
          preimage="$product/obj/PACKAGING/recovery_intermediates/ramdisk_files-timestamp"

          # Emit live diagnostics; a runner shutdown otherwise erases its
          # temporary files. Record RAM/swap, disk and cgroup OOM counters.
          (
            while :; do
              printf 'SONGYUAN_RESOURCE ts=%s ' "$(date -u +%FT%TZ)"
              free -m | awk '/^Mem:/ {printf "mem_avail_mib=%s ", $7} /^Swap:/ {printf "swap_used_mib=%s swap_free_mib=%s ", $3, $4}'
              printf 'disk_free_gib=%s ' "$(df -Pk "$GITHUB_WORKSPACE" | awk 'END {printf "%.1f", $4/1048576}')"
              if [[ -r /sys/fs/cgroup/memory.events ]]; then
                awk '/^(oom|oom_kill) / {printf "cgroup_%s=%s ", $1, $2}' /sys/fs/cgroup/memory.events
              fi
              echo
              sleep 30
            done
          ) &
          resource_monitor_pid=$!
          trap 'kill "$resource_monitor_pid" 2>/dev/null || true' EXIT
          # Graph-only preflight: complete Soong + Kati graph, no Ninja compile.
          # Catch ALL install-output conflicts before expensive compilation.
          m --skip-ninja "$preimage"
          test -s out/soong/installs-twrp_songyuan.mk
          echo 'PASS: complete native Soong/Make graph accepts the install map'
          m -j2 "$preimage"
          test -f "$preimage"
          test -s "$product/recovery/root/system/bin/recovery"
          cmp -s "$product/recovery/root/init.recovery.usb.rc" "$TWRP_DIR/device/xiaomi/songyuan/usb/init.recovery.usb.rc"
          cmp -s "$product/recovery/root/system/etc/recovery.fstab" "$TWRP_DIR/device/xiaomi/songyuan/recovery.fstab"
          test ! -e "$product/recovery.img"
          test ! -e "$product/ramdisk-recovery.img"
          test ! -e "$product/ramdisk-recovery.cpio"
          echo "PASS: original recoveryimage dependency graph built up to recovery root; no image created"
      - name: Verify ELF
        shell: bash
        run: |
          set -euo pipefail
          product="$TWRP_DIR/out/target/product/songyuan"
          root="$product/recovery/root"
          out="$RUNNER_TEMP/songyuan-checked"
          mkdir -p "$out/paired-runtime"
          python3 tools/songyuan/ensure_recovery_preload.py "$root"
          source=""
          for p in "$root/system/bin/recovery" "$root/sbin/recovery" "$product/obj/EXECUTABLES/recovery_intermediates/recovery"; do
            if [[ -s "$p" ]] && readelf -h "$p" 2>/dev/null | grep -q 'Machine:.*AArch64'; then
              source="$p"
              break
            fi
          done
          test -n "$source"
          cp "$source" "$out/recovery"
          for p in system/bin/servicemanager system/lib64/libbinder.so system/lib64/libbinder_ndk.so; do
            test -s "$root/$p"
            mkdir -p "$out/paired-runtime/$(dirname "$p")"
            cp -L "$root/$p" "$out/paired-runtime/$p"
          done
          python3 tools/songyuan/audit_compiled_runtime.py "$out" "$root"
          python3 tools/songyuan/export_native_runtime_closure.py "$out" "$root"
          python3 tools/songyuan/check_minui_preload_closure.py "$root"
          python3 tools/songyuan/export_native_boot_contract.py "$out" "$root"
          python3 tools/songyuan/check_recovery_property_contexts.py "$root" "$out"
          sha256sum "$out/recovery"
          echo "ELF checks complete"
      - name: Publish verified ELF release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/songyuan"
          test "${GITHUB_ACTOR}" = "rakarizaldy-id"
          out="$RUNNER_TEMP/songyuan-checked"
          product="$TWRP_DIR/out/target/product/songyuan"
          root="$product/recovery/root"
          test -s "$out/recovery"
          test -d "$root"
          readelf -h "$out/recovery" | grep -q 'Machine:.*AArch64'
          test ! -e "$product/recovery.img"
          test ! -e "$product/ramdisk-recovery.img"
          test ! -e "$product/ramdisk-recovery.cpio"

          # Preserve matching compiled recovery runtime as a separate support
          # asset, so ELF can actually be assembled into recovery outside GH.
          tar -C "$root" -cf - . | zstd -T2 -3 -o "$out/songyuan-recovery-root.tar.zst"
          test -s "$out/songyuan-recovery-root.tar.zst"
          # Hash the EXACT names users download. The previous workflow hashed
          # "recovery" but renamed the uploaded asset; sha256sum -c would fail.
          cp "$out/recovery" "$out/recovery-songyuan-aarch64.elf"
          (cd "$out" && sha256sum recovery-songyuan-aarch64.elf songyuan-recovery-root.tar.zst > SHA256SUMS.txt)
          (cd "$out" && sha256sum -c SHA256SUMS.txt)

          tag="songyuan-elf-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            "$out/recovery-songyuan-aarch64.elf" \
            "$out/songyuan-recovery-root.tar.zst#songyuan-recovery-root.tar.zst" \
            "$out/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Songyuan TWRP16 ELF (run ${GITHUB_RUN_ID})" \
            --notes "Build-only recovery output for POCO F9 Ultra (songyuan, original ID305). The ELF is NOT a flashable recovery.img. Includes the matching compiled recovery-root files and checksums for offline image assembly. No recovery image was built or uploaded by GitHub Actions."
