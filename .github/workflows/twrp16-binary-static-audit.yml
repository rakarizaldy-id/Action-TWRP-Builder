name: TWRP16 binary builder static audit (no source sync)

on:
  push:
    branches:
      - twrp16-songyuan-source-probe
    paths:
      - scripts/twrp16-public-sm8850-binary-probe.sh
      - scripts/stage-public-sm8850-tree.sh
      - scripts/songyuan-twrp16-full-source-sync.sh
      - .github/workflows/twrp16-public-sm8850-binary-probe.yml
      - .github/workflows/twrp16-binary-static-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate Bash, workflow structure, privacy, and binary-only scope
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/songyuan-twrp16-full-source-sync.sh
          bash -n scripts/twrp16-public-sm8850-binary-probe.sh
          bash -n scripts/stage-public-sm8850-tree.sh
          # Execute REAL staging into a fresh hierarchy deliberately missing device/xiaomi.
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/upstream/prebuilt"
          printf 'BoardConfig known-good\n' > "$fixture/upstream/BoardConfig.mk"
          printf 'android products known-good\n' > "$fixture/upstream/AndroidProducts.mk"
          printf 'PRODUCT_NAME := twrp_sm8850\n' > "$fixture/upstream/twrp_sm8850.mk"
          printf 'kernel-fixture\n' > "$fixture/upstream/prebuilt/kernel"
          test ! -d "$fixture/checkout/device/xiaomi"
          bash scripts/stage-public-sm8850-tree.sh \
            "$fixture/upstream" "$fixture/checkout/device/xiaomi/sm8850"
          test -d "$fixture/checkout/device/xiaomi/sm8850"
          cmp "$fixture/upstream/prebuilt/kernel" \
              "$fixture/checkout/device/xiaomi/sm8850/prebuilt/kernel"
          # Refusal to overwrite an existing device tree is also mandatory.
          if bash scripts/stage-public-sm8850-tree.sh \
            "$fixture/upstream" "$fixture/checkout/device/xiaomi/sm8850"; then
            echo "::error::Stage script incorrectly overwrote an existing tree"
            exit 1
          fi
          echo "PASS: actual source-tree stage onto a fresh, nonexistent device/xiaomi parent."
          python3 - <<'PY'
          from pathlib import Path
          sync = Path("scripts/songyuan-twrp16-full-source-sync.sh").read_text()
          build = Path("scripts/twrp16-public-sm8850-binary-probe.sh").read_text()
          wf = Path(".github/workflows/twrp16-public-sm8850-binary-probe.yml").read_text()
          assert 'repo init -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp' in sync
          assert '--depth=1' in sync and '--partial-clone' not in sync
          assert 'run_guarded "clang" 2400' in sync
          assert 'run_guarded "full-sync" 18000' in sync
          assert 'MIN_FREE_KIB=26214400' in sync
          assert 'lunch twrp_sm8850' in build
          assert '    m recovery\n' in build
          assert 'CHECKPOINT: lunch PASS' in build
          assert 'BUILD-HEARTBEAT' in build
          assert 'oom_kill' in build
          assert 'scripts/stage-public-sm8850-tree.sh' in build
          assert 'No Songyuan private OEM' in build or 'no Songyuan OEM' in build
          stage = Path("scripts/stage-public-sm8850-tree.sh").read_text()
          assert 'mkdir -p -- "$(dirname "$dest")"' in stage
          assert 'cp -a -- "$from" "$dest"' in stage
          assert 'm recoveryimage' not in build.lower()
          assert not any(s in build for s in ('m recovery -j','make recoveryimage','/songyuan-id305-curated'))
          assert 'build-requests/public-sm8850-compile.txt' in wf
          assert 'Verify public YuKongA device tree BEFORE 74G source checkout' in wf
          assert 'Static preflight before expensive source checkout' in wf
          assert 'bash -n scripts/twrp16-public-sm8850-binary-probe.sh' in wf
          assert 'm recoveryimage' not in wf.lower().replace('never m recoveryimage','')
          print("PASS: Bash syntax; full-sync; preflight tree; runtime checkpoints; no -j in m recovery; no recovery.img build; no private OEM.")
          PY
